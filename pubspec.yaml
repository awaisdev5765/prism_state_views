name: prism_state_views
description: >-
  One widget for empty, loading, error, and success states in Flutter — with
  retry callbacks, custom icons, and Dart 3 sealed view-state classes. Pure
  Flutter, works on all six platforms.
version: 0.1.0
repository: https://github.com/awaisdev5765/prism_state_views
issue_tracker: https://github.com/awaisdev5765/prism_state_views/issues
topics:
  - state
  - empty
  - loading
  - error
  - widget

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
